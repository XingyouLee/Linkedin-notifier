name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-unit-tests:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest requests

      - name: Run unit tests
        run: pytest tests -q

  dag-integrity:
    name: DAG integrity (Astro)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Astro CLI
        run: curl -sSL install.astronomer.io | sudo bash -s

      # astro dev pytest builds the project image and runs pytest inside the
      # Astro Runtime container. It does NOT start the Airflow scheduler.
      - name: DAG parse check
        run: astro dev pytest .astro/test_dag_integrity_default.py --args "-q"

  swift-tests:
    name: Swift tests
    runs-on: macos-latest
    # The macOS client is not part of the Airflow/Zeabur deployment image,
    # and GitHub-hosted macOS runners can lag the app's Swift tools version.
    # Keep this signal visible without blocking GHCR publish for Airflow.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Run Swift tests
        run: swift test --package-path apps/macos/LinkedinNotifierApp

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs:
      - python-unit-tests
      - dag-integrity
    steps:
      - uses: actions/checkout@v4

      - name: Build deployment image
        run: docker build -t linkedin-notifier:${{ github.sha }} .

  publish-image:
    name: Publish image to GHCR
    runs-on: ubuntu-latest
    needs:
      - docker-build
    if: >
      github.event_name == 'push' &&
      (github.ref_name == 'main' || github.ref_name == 'zeabur-airflow-deploy')
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
      sha_tag: ${{ steps.image.outputs.sha_tag }}
      branch_tag: ${{ steps.image.outputs.branch_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tags
        id: image
        shell: bash
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          branch="${GITHUB_REF_NAME//\//-}"
          image="ghcr.io/${repo}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${image}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "branch_tag=${image}:${branch}" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "latest_tag=${image}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "latest_tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build image
        run: |
          tags=(
            "${{ steps.image.outputs.sha_tag }}"
            "${{ steps.image.outputs.branch_tag }}"
          )
          if [[ -n "${{ steps.image.outputs.latest_tag }}" ]]; then
            tags+=("${{ steps.image.outputs.latest_tag }}")
          fi
          args=()
          for tag in "${tags[@]}"; do
            args+=("-t" "$tag")
          done
          docker build "${args[@]}" .

      - name: Push image
        run: |
          docker push "${{ steps.image.outputs.sha_tag }}"
          docker push "${{ steps.image.outputs.branch_tag }}"
          if [[ -n "${{ steps.image.outputs.latest_tag }}" ]]; then
            docker push "${{ steps.image.outputs.latest_tag }}"
          fi
