name: CI

on:
  push:
    # Only run on pushes to main branches directly; feature branches are
    # covered by pull_request events to avoid double-triggering CI on every
    # push while a PR is open.
    branches:
      - main
      - zeabur-airflow-deploy
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-unit-tests:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run unit tests
        run: pytest tests -q

  dag-integrity:
    name: DAG integrity (Astro)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Astro CLI
        run: curl -sSL install.astronomer.io | sudo bash -s

      # astro dev pytest builds the project image and runs pytest inside the
      # Astro Runtime container. It does NOT start the Airflow scheduler.
      - name: DAG parse check
        run: astro dev pytest .astro/test_dag_integrity_default.py --args "-q"

  publish-image:
    name: Build and publish image to GHCR
    runs-on: ubuntu-latest
    needs:
      - python-unit-tests
      - dag-integrity
    # Build on every qualifying run; only push on main-branch pushes.
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
      sha_tag: ${{ steps.image.outputs.sha_tag }}
      branch_tag: ${{ steps.image.outputs.branch_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tags
        id: image
        shell: bash
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          branch="${GITHUB_REF_NAME//\//-}"
          image="ghcr.io/${repo}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${image}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "branch_tag=${image}:${branch}" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "latest_tag=${image}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "latest_tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        if: >
          github.event_name == 'push' &&
          (github.ref_name == 'main' || github.ref_name == 'zeabur-airflow-deploy')
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build image
        run: |
          # Build with all final tags so layers are shared and each push
          # references blobs already uploaded — avoids GHCR "unknown blob"
          # errors that occur when docker-tagging after the fact across repos.
          tags=("-t" "linkedin-notifier:${{ github.sha }}")
          if [[ "${{ github.event_name }}" == "push" ]] && \
             { [[ "${{ github.ref_name }}" == "main" ]] || \
               [[ "${{ github.ref_name }}" == "zeabur-airflow-deploy" ]]; }; then
            tags+=("-t" "${{ steps.image.outputs.sha_tag }}")
            tags+=("-t" "${{ steps.image.outputs.branch_tag }}")
            if [[ -n "${{ steps.image.outputs.latest_tag }}" ]]; then
              tags+=("-t" "${{ steps.image.outputs.latest_tag }}")
            fi
          fi
          docker build "${tags[@]}" .

      - name: Push image
        if: >
          github.event_name == 'push' &&
          (github.ref_name == 'main' || github.ref_name == 'zeabur-airflow-deploy')
        run: |
          docker push "${{ steps.image.outputs.sha_tag }}"
          docker push "${{ steps.image.outputs.branch_tag }}"
          if [[ -n "${{ steps.image.outputs.latest_tag }}" ]]; then
            docker push "${{ steps.image.outputs.latest_tag }}"
          fi

  deploy-zeabur:
    name: Update Zeabur image tag
    runs-on: ubuntu-latest
    needs:
      - publish-image
    if: >
      github.event_name == 'push' &&
      github.ref_name == 'zeabur-airflow-deploy'
    env:
      ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
      ZEABUR_SERVICE_ID: ${{ secrets.ZEABUR_SERVICE_ID }}
      ZEABUR_ENVIRONMENT_ID: ${{ secrets.ZEABUR_ENVIRONMENT_ID }}
      ZEABUR_WORKSPACE: ${{ secrets.ZEABUR_WORKSPACE }}
    steps:
      - name: Check Zeabur deployment config
        id: zeabur-config
        shell: bash
        run: |
          missing=()
          [[ -n "$ZEABUR_TOKEN" ]] || missing+=("ZEABUR_TOKEN")
          [[ -n "$ZEABUR_SERVICE_ID" ]] || missing+=("ZEABUR_SERVICE_ID")
          [[ -n "$ZEABUR_ENVIRONMENT_ID" ]] || missing+=("ZEABUR_ENVIRONMENT_ID")

          if (( ${#missing[@]} > 0 )); then
            printf -v joined '%s, ' "${missing[@]}"
            echo "::notice::Skipping Zeabur deploy; missing GitHub secrets: ${joined%, }"
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Update Zeabur Docker image tag
        if: steps.zeabur-config.outputs.configured == 'true'
        shell: bash
        run: |
          workspace_arg=()
          if [[ -n "$ZEABUR_WORKSPACE" ]]; then
            workspace_arg=("--workspace" "$ZEABUR_WORKSPACE")
          fi

          npx --yes zeabur@0.18.0 "${workspace_arg[@]}" auth login --token "$ZEABUR_TOKEN" -i=false
          npx --yes zeabur@0.18.0 "${workspace_arg[@]}" service update tag \
            --id "$ZEABUR_SERVICE_ID" \
            --env-id "$ZEABUR_ENVIRONMENT_ID" \
            --tag "${{ github.sha }}" \
            --yes \
            -i=false
